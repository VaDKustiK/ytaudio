title = "ytaudio secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public SHA-256 of the pinned KeyNet ONNX artifact, not a credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^8ddfa02806ff61937992533e3ddaca85267c6d3161f793bc44e8f5cb5189d211$''']
paths = ['''^(internal/analyzer/models\.go|native-analyzer/models\.lock\.json)$''']
