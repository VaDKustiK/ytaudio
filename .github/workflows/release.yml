name: Release
# main is the production branch. A release is visible only after every target
# builds successfully. Nothing in this workflow runs until changes are pushed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version, e.g. v0.2.0 (blank uses v0.2.<run number>)'
        required: false
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="${INPUT_VERSION:-v0.2.${RUN_NUMBER}}"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: [version, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: windows, goarch: amd64, runner: windows-2022}
          - {goos: windows, goarch: arm64, runner: windows-2022}
          - {goos: darwin, goarch: arm64, runner: macos-15}
          - {goos: linux, goarch: amd64, runner: ubuntu-22.04}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux packaging requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev zstd
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.45.2
      - name: Windows packaging requirements
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Test core on build host
        run: go test ./...
      - name: Icon generation requirements
        run: python -m pip install Pillow==13.0.0
      - name: Build desktop packages
        run: python scripts/package.py --os ${{ matrix.goos }} --arch ${{ matrix.goarch }} --version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ytaudio-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ytaudio-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ytaudio ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
